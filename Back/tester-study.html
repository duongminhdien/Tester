<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middle Tester 面试备考系统</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --card: #ffffff;
  --border: #e2e6ef;
  --border-bright: #c8cedc;
  --accent: #16a34a;
  --accent-dim: #15803d;
  --accent-bg: rgba(22,163,74,0.08);
  --accent-bg2: rgba(22,163,74,0.13);
  --text: #1a1f2e;
  --text-muted: #5a6380;
  --text-dim: #9aa0b8;
  --red: #dc2626;
  --red-bg: rgba(220,38,38,0.08);
  --amber: #d97706;
  --amber-bg: rgba(217,119,6,0.08);
  --blue: #2563eb;
  --blue-bg: rgba(37,99,235,0.08);
  --radius: 10px;
  --radius-lg: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #eef0f5; }
::-webkit-scrollbar-thumb { background: #c8cedc; border-radius: 3px; }

/* LAYOUT */
.app { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  box-shadow: 2px 0 12px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.sidebar-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.sidebar-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.progress-wrap { padding: 20px 24px; border-bottom: 1px solid var(--border); }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-muted); margin-bottom: 8px;
}
.progress-bar {
  height: 4px; background: var(--border);
  border-radius: 99px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 99px;
  transition: width 0.5s ease;
  width: 0%;
}

.nav { padding: 12px 12px; flex: 1; }

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
  border: 1px solid transparent;
  position: relative;
}
.nav-item:hover { background: #f0f2f7; border-color: var(--border); }
.nav-item.active { background: var(--accent-bg2); border-color: var(--accent-dim); }

.nav-icon {
  width: 32px; height: 32px;
  background: #f0f2f7;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: background 0.15s;
}
.nav-item.active .nav-icon { background: var(--accent-bg2); }
.nav-item.done .nav-icon { background: rgba(22,163,74,0.15); }

.nav-info { flex: 1; min-width: 0; }
.nav-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-zh { font-size: 11px; color: var(--text-muted); }

.nav-badge {
  font-family: 'Space Mono', monospace;
  font-size: 9px; padding: 2px 6px;
  border-radius: 99px;
  background: #eef0f5;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.nav-item.done .nav-badge { background: var(--accent-bg); color: var(--accent-dim); }

/* MAIN */
.main {
  margin-left: 280px;
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* TOP BAR */
.topbar {
  padding: 20px 40px;
  border-bottom: 1px solid var(--border);
  background: #ffffff;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-left h1 { font-size: 20px; font-weight: 700; }
.topbar-left p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

.tab-bar {
  display: flex; gap: 4px;
  background: #f0f2f7;
  padding: 4px; border-radius: var(--radius);
  border: 1px solid var(--border);
}
.tab-btn {
  padding: 7px 18px;
  border-radius: 7px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text-muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border-bright);
}

/* CONTENT */
.content { padding: 36px 40px; flex: 1; max-width: 900px; }

/* LESSON */
.lesson-section { display: none; }
.lesson-section.visible { display: block; }

.section-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: 0.1em;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  padding: 4px 10px; border-radius: 99px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.lesson-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.lesson-block:hover { border-color: var(--border-bright); }

.block-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 700;
  color: var(--accent);
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.03em;
}

.block-body {
  font-size: 14px;
  line-height: 1.9;
  color: #3a4158;
}
.block-body b { color: var(--text); font-weight: 700; }
.block-body br { display: block; content: ""; margin-top: 2px; }

.highlight-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px; margin-top: 14px;
}
.highlight-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.highlight-card .hc-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.highlight-card .hc-val { font-size: 13px; font-weight: 500; color: var(--text); }

/* INTERVIEW */
.interview-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.interview-card:hover { border-color: var(--border-bright); }

.interview-q {
  padding: 16px 20px;
  display: flex; align-items: flex-start; gap: 12px;
  cursor: pointer;
  user-select: none;
}
.q-num {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-dim);
  padding: 3px 7px; border-radius: 5px;
  flex-shrink: 0; margin-top: 1px;
}
.q-text { font-size: 14px; font-weight: 500; flex: 1; }
.q-arrow {
  color: var(--text-dim);
  font-size: 12px;
  flex-shrink: 0;
  transition: transform 0.2s;
  margin-top: 3px;
}
.interview-card.open .q-arrow { transform: rotate(90deg); }

.interview-a {
  padding: 0 20px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, padding 0.2s;
}
.interview-card.open .interview-a {
  padding: 0 20px 16px;
  max-height: 400px;
}
.answer-box {
  background: #f5f8ff;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.8;
  color: #3a4158;
}
.answer-box b { color: var(--text); }

/* QUIZ */
.quiz-header {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.quiz-score-display {
  text-align: center;
}
.score-big { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; color: var(--accent); }
.score-label { font-size: 11px; color: var(--text-muted); }
.quiz-stat { flex: 1; }
.quiz-stat-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.quiz-stat-sub { font-size: 12px; color: var(--text-muted); }

.quiz-q-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 12px;
}
.q-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px; color: var(--text-muted);
  margin-bottom: 8px; letter-spacing: 0.1em;
}
.q-question { font-size: 14px; font-weight: 500; margin-bottom: 14px; line-height: 1.6; }

.opts { display: flex; flex-direction: column; gap: 6px; }
.opt-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #f9fafb;
  cursor: pointer;
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text);
  transition: all 0.15s;
  text-align: left;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent-dim); background: var(--accent-bg); }
.opt-btn .opt-letter {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #e8ecf4;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 10px; font-weight: 700;
  flex-shrink: 0;
  color: var(--text-muted);
  transition: background 0.15s;
}
.opt-btn.selected .opt-letter { background: var(--accent-dim); color: #fff; }
.opt-btn.correct .opt-letter { background: var(--accent); color: #fff; }
.opt-btn.wrong .opt-letter { background: var(--red); color: #fff; }
.opt-btn.selected { border-color: var(--accent-dim); background: var(--accent-bg); }
.opt-btn.correct { border-color: var(--accent-dim); background: var(--accent-bg); }
.opt-btn.wrong { border-color: #b91c1c; background: var(--red-bg); }
.opt-btn:disabled { cursor: default; }

.explain-box {
  display: none;
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  background: #f5f8ff;
  border-left: 3px solid var(--accent);
  font-size: 13px;
  color: #3a4158;
  line-height: 1.7;
}
.explain-box.show { display: block; }
.explain-box.wrong-exp { border-left-color: var(--red); }

.quiz-actions {
  display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;
}
.btn-check {
  padding: 11px 28px;
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: var(--radius);
  font-size: 14px; font-weight: 700;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-check:hover { opacity: 0.88; }
.btn-check:active { transform: scale(0.97); }
.btn-reset {
  padding: 11px 20px;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-reset:hover { background: var(--card); color: var(--text); border-color: var(--border-bright); }

/* EMPTY */
.empty-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 60px 40px;
  text-align: center;
}
.empty-icon { font-size: 56px; margin-bottom: 20px; }
.empty-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.empty-sub { font-size: 14px; color: var(--text-muted); max-width: 400px; line-height: 1.7; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 36px;
  width: 100%; max-width: 480px;
}
.stat-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.stat-n { font-family: 'Space Mono', monospace; font-size: 24px; font-weight: 700; color: var(--accent); }
.stat-l { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 100%; position: relative; height: auto; }
  .main { margin-left: 0; }
  .app { flex-direction: column; }
  .content { padding: 20px; }
  .topbar { padding: 16px 20px; flex-direction: column; gap: 12px; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">▣ Tester Academy</div>
      <div class="sidebar-title">Middle Tester<br>面试备考系统</div>
      <div class="sidebar-sub">Hệ thống ôn tập phỏng vấn</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Tiến độ</span>
        <span id="progressLabel">0 / 6 hoàn thành</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <nav class="nav" id="navList"></nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div id="emptyState" class="empty-main">
      <div class="empty-icon">🎯</div>
      <div class="empty-title">Chào mừng đến với hệ thống ôn thi</div>
      <div class="empty-sub">Chọn một chủ đề bên trái để bắt đầu học bài giảng tiếng Trung và luyện tập câu hỏi phỏng vấn.</div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-n">6</div><div class="stat-l">Chủ đề</div></div>
        <div class="stat-card"><div class="stat-n">24</div><div class="stat-l">Câu quiz</div></div>
        <div class="stat-card"><div class="stat-n">30+</div><div class="stat-l">Câu PV</div></div>
      </div>
    </div>

    <div id="topbarWrap" style="display:none">
      <div class="topbar">
        <div class="topbar-left">
          <h1 id="topbarTitle"></h1>
          <p id="topbarSub"></p>
        </div>
        <div class="tab-bar">
          <button class="tab-btn active" onclick="switchTab('lesson')">📖 Bài giảng</button>
          <button class="tab-btn" onclick="switchTab('interview')">💬 Câu hỏi PV</button>
          <button class="tab-btn" onclick="switchTab('quiz')">✅ Kiểm tra</button>
        </div>
      </div>
    </div>

    <div class="content" id="mainContent" style="display:none">
      <div id="tabLesson" class="lesson-section visible"></div>
      <div id="tabInterview" class="lesson-section"></div>
      <div id="tabQuiz" class="lesson-section"></div>
    </div>
  </main>
</div>

<script>
const topics = [
  {
    id: 0, icon: "🧪", title: "Testing Fundamentals", zh: "软件测试基础", badge: "Nền tảng",
    lesson: [
      {
        title: "01 — 什么是软件测试？",
        body: `软件测试（Software Testing）是通过<b>执行程序</b>来验证软件是否满足需求、发现缺陷的过程。<br><br>
<b>测试的核心目标：</b><br>
• 验证软件是否符合需求规格（Verification）<br>
• 确认软件满足用户实际需求（Validation）<br>
• 尽早发现并修复缺陷，降低成本<br>
• 提升软件质量和用户信任度<br><br>
<b>⚠️ 重要原则：</b> 测试的目的不是证明软件没有错误，而是<b>尽可能多地发现错误</b>。`
      },
      {
        title: "02 — SDLC 与 STLC",
        body: `<b>SDLC（软件开发生命周期）：</b><br>
需求分析 → 设计 → 开发 → 测试 → 部署 → 维护<br><br>
<b>STLC（软件测试生命周期）：</b><br>
1. 需求分析（Requirement Analysis）<br>
2. 测试计划（Test Planning）<br>
3. 测试用例设计（Test Case Design）<br>
4. 测试环境搭建（Test Environment Setup）<br>
5. 测试执行（Test Execution）<br>
6. 缺陷报告与关闭（Defect Reporting & Closure）<br><br>
STLC 是 SDLC 的<b>子集</b>，专注于测试活动本身。`
      },
      {
        title: "03 — 测试类型",
        body: `<b>按代码可见度：</b><br>
• <b>黑盒测试（Black Box）</b>：不知内部代码，只测输入输出<br>
• <b>白盒测试（White Box）</b>：了解代码逻辑，测试覆盖路径<br>
• <b>灰盒测试（Grey Box）</b>：两者结合<br><br>
<b>按功能性：</b><br>
• <b>功能测试（Functional）</b>：验证功能是否正常<br>
• <b>非功能测试（Non-functional）</b>：性能、安全、兼容性等<br><br>
<b>按执行方式：</b><br>
• 手动测试（Manual Testing）<br>
• 自动化测试（Automation Testing）`
      },
      {
        title: "04 — 测试级别",
        body: `• <b>单元测试（Unit Test）</b>：开发人员测试单个模块或函数<br>
• <b>集成测试（Integration Test）</b>：测试模块间的接口和交互<br>
• <b>系统测试（System Test）</b>：测试整个系统的完整功能<br>
• <b>验收测试（UAT）</b>：由用户/客户验证系统是否满足业务需求<br><br>
<b>Verification vs Validation：</b><br>
• <b>Verification（验证）</b>：我们是否在正确地构建产品？→ 静态测试、评审<br>
• <b>Validation（确认）</b>：我们是否构建了正确的产品？→ 动态测试、运行软件`
      }
    ],
    interview: [
      { q: "什么是软件测试？测试的目的是什么？", a: "软件测试是通过执行软件来发现缺陷、验证功能的过程。目的是<b>提升质量</b>，而非证明没有错误。缺陷发现越早，修复成本越低。" },
      { q: "SDLC 和 STLC 有什么区别？", a: "SDLC 是软件开发的完整周期（需求→设计→开发→测试→部署→维护）；STLC 是测试专属周期，是 SDLC 的子集，专注于测试活动的规划、执行和关闭。" },
      { q: "黑盒测试和白盒测试有什么区别？", a: "<b>黑盒测试</b>：不需要了解代码，只验证功能输入输出，适合功能测试和 UAT。<br><b>白盒测试</b>：需要了解代码逻辑，测试覆盖路径和分支，通常由开发人员执行。" },
      { q: "什么是回归测试（Regression Testing）？", a: "回归测试是在代码修改后，重新执行之前通过的测试用例，确保新改动没有引入新的缺陷（即没有「回退」）。是 CI/CD 中自动化的核心场景。" },
      { q: "Verification 和 Validation 的区别？", a: "<b>Verification</b>（验证）：做对了吗？→ 检查文档、评审、静态测试。<br><b>Validation</b>（确认）：做的是对的东西吗？→ 动态测试，运行软件验证。" },

let currentTopic = null;
let currentTab = 'lesson';
let completedTopics = new Set();
let quizAnswers = {};
let quizChecked = false;

function renderNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = topics.map(t => `
    <div class="nav-item ${currentTopic === t.id ? 'active' : ''} ${completedTopics.has(t.id) ? 'done' : ''}"
         onclick="selectTopic(${t.id})">
      <div class="nav-icon">${t.icon}</div>
      <div class="nav-info">
        <div class="nav-name">${t.title}</div>
        <div class="nav-zh">${t.zh}</div>
      </div>
      <div class="nav-badge">${completedTopics.has(t.id) ? '✓' : t.badge}</div>
    </div>
  `).join('');
  const pct = (completedTopics.size / topics.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = completedTopics.size + ' / ' + topics.length + ' hoàn thành';
}

function selectTopic(id) {
  currentTopic = id;
  quizAnswers = {};
  quizChecked = false;
  const t = topics[id];

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('topbarWrap').style.display = 'block';
  document.getElementById('mainContent').style.display = 'block';

  document.getElementById('topbarTitle').textContent = t.icon + ' ' + t.title;
  document.getElementById('topbarSub').textContent = t.zh + ' — ' + t.lesson.length + ' bài học · ' + t.quiz.length + ' câu quiz';

  renderLesson(t);
  renderInterview(t);
  renderQuiz(t);
  switchTab('lesson');
  renderNav();
}

function renderLesson(t) {
  const el = document.getElementById('tabLesson');
  el.innerHTML = `<div class="section-badge">📖 Bài giảng · ${t.zh}</div>` +
    t.lesson.map(b => `
      <div class="lesson-block">
        <div class="block-title">${b.title}</div>
        <div class="block-body">${b.body}</div>
      </div>
    `).join('');
}

function renderInterview(t) {
  const el = document.getElementById('tabInterview');
  el.innerHTML = `<div class="section-badge">💬 Câu hỏi phỏng vấn · ${t.interview.length} câu</div>` +
    t.interview.map((item, i) => `
      <div class="interview-card" id="ic${i}" onclick="toggleQ(${i})">
        <div class="interview-q">
          <span class="q-num">Q${String(i+1).padStart(2,'0')}</span>
          <span class="q-text">${item.q}</span>
          <span class="q-arrow">▶</span>
        </div>
        <div class="interview-a">
          <div class="answer-box">${item.a}</div>
        </div>
      </div>
    `).join('');
}

function toggleQ(i) {
  const card = document.getElementById('ic' + i);
  card.classList.toggle('open');
}

function renderQuiz(t) {
  const el = document.getElementById('tabQuiz');
  el.innerHTML = `
    <div class="section-badge">✅ Bài kiểm tra · ${t.quiz.length} câu</div>
    <div id="quizScoreArea" style="display:none" class="quiz-header">
      <div class="quiz-score-display">
        <div class="score-big" id="scoreBig">0/${t.quiz.length}</div>
        <div class="score-label">kết quả</div>
      </div>
      <div class="quiz-stat">
        <div class="quiz-stat-title" id="scoreMsg"></div>
        <div class="quiz-stat-sub" id="scoreSub"></div>
      </div>
    </div>
    ${t.quiz.map((q, i) => `
      <div class="quiz-q-block">
        <div class="q-label">CÂU ${i+1} / ${t.quiz.length}</div>
        <div class="q-question">${q.q}</div>
        <div class="opts">
          ${q.opts.map((o, j) => `
            <button class="opt-btn" id="opt${i}_${j}" onclick="pickAns(${i},${j})">
              <span class="opt-letter">${String.fromCharCode(65+j)}</span>
              ${o}
            </button>
          `).join('')}
        </div>
        <div class="explain-box" id="exp${i}">${q.exp}</div>
      </div>
    `).join('')}
    <div class="quiz-actions">
      <button class="btn-check" onclick="checkAnswers()">Kiểm tra đáp án</button>
      <button class="btn-reset" onclick="resetQuiz()">↺ Làm lại</button>
    </div>
  `;
}

function pickAns(qi, oi) {
  if (quizChecked) return;
  const t = topics[currentTopic];
  const prev = quizAnswers[qi];
  if (prev !== undefined) {
    document.getElementById('opt'+qi+'_'+prev).classList.remove('selected');
  }
  quizAnswers[qi] = oi;
  document.getElementById('opt'+qi+'_'+oi).classList.add('selected');
}

function checkAnswers() {
  if (quizChecked) return;
  quizChecked = true;
  const t = topics[currentTopic];
  let score = 0;
  t.quiz.forEach((q, i) => {
    const allOpts = t.quiz[i].opts;
    allOpts.forEach((_, j) => {
      const btn = document.getElementById('opt'+i+'_'+j);
      btn.disabled = true;
      btn.classList.remove('selected');
    });
    const exp = document.getElementById('exp'+i);
    if (quizAnswers[i] === q.ans) {
      score++;
      document.getElementById('opt'+i+'_'+q.ans).classList.add('correct');
      exp.classList.add('show');
    } else {
      document.getElementById('opt'+i+'_'+q.ans).classList.add('correct');
      if (quizAnswers[i] !== undefined) {
        document.getElementById('opt'+i+'_'+quizAnswers[i]).classList.add('wrong');
      }
      exp.classList.add('show', 'wrong-exp');
    }
  });
  const pct = Math.round(score / t.quiz.length * 100);
  const area = document.getElementById('quizScoreArea');
  area.style.display = 'flex';
  document.getElementById('scoreBig').textContent = score + '/' + t.quiz.length;
  document.getElementById('scoreMsg').textContent = pct >= 75 ? '✅ Đạt yêu cầu! Bạn đã hiểu chủ đề này.' : '⚠️ Cần ôn thêm. Xem lại bài giảng nhé.';
  document.getElementById('scoreSub').textContent = 'Tỷ lệ đúng: ' + pct + '%' + (pct >= 75 ? ' — Chủ đề đã hoàn thành!' : '');
  if (pct >= 75) { completedTopics.add(currentTopic); renderNav(); }
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  quizAnswers = {};
  quizChecked = false;
  renderQuiz(topics[currentTopic]);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['lesson','interview','quiz'][i] === tab);
  });
  document.getElementById('tabLesson').classList.toggle('visible', tab === 'lesson');
  document.getElementById('tabInterview').classList.toggle('visible', tab === 'interview');
  document.getElementById('tabQuiz').classList.toggle('visible', tab === 'quiz');
}

renderNav();
</script>
</body>
</html>
