<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接口测试精通系统 — Postman & JMeter</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --card: #ffffff;
  --border: #e2e6ef;
  --border-bright: #c8cedc;
  --accent: #2563eb;
  --accent-dim: #1d4ed8;
  --accent-bg: rgba(37,99,235,0.07);
  --accent-bg2: rgba(37,99,235,0.12);
  --text: #1a1f2e;
  --text-muted: #5a6380;
  --text-dim: #9aa0b8;
  --green: #16a34a;
  --green-bg: rgba(22,163,74,0.08);
  --red: #dc2626;
  --red-bg: rgba(220,38,38,0.08);
  --amber: #d97706;
  --amber-bg: rgba(217,119,6,0.08);
  --radius: 10px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #eef0f5; }
::-webkit-scrollbar-thumb { background: #c8cedc; border-radius: 3px; }

/* LAYOUT */
.app { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 290px; background: var(--surface);
  border-right: 1px solid var(--border);
  box-shadow: 2px 0 12px rgba(0,0,0,0.05);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 100; overflow-y: auto;
}
.sidebar-header { padding: 24px 22px 18px; border-bottom: 1px solid var(--border); }
.logo { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
.sidebar-title { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.35; }
.sidebar-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

.progress-wrap { padding: 16px 22px; border-bottom: 1px solid var(--border); }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 7px; }
.progress-bar { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; width: 0%; }

.nav { padding: 10px; flex: 1; }
.nav-section { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase; padding: 12px 10px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius);
  cursor: pointer; transition: all 0.15s; margin-bottom: 2px;
  border: 1px solid transparent;
}
.nav-item:hover { background: #f0f2f7; border-color: var(--border); }
.nav-item.active { background: var(--accent-bg2); border-color: var(--accent-dim); }
.nav-icon { width: 30px; height: 30px; background: #f0f2f7; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.nav-item.active .nav-icon { background: var(--accent-bg2); }
.nav-item.done .nav-icon { background: rgba(22,163,74,0.15); }
.nav-info { flex: 1; min-width: 0; }
.nav-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-zh { font-size: 10.5px; color: var(--text-muted); }
.nav-check { font-size: 11px; color: var(--green); flex-shrink: 0; display: none; }
.nav-item.done .nav-check { display: block; }

/* MAIN */
.main { margin-left: 290px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* TOPBAR */
.topbar {
  padding: 18px 36px; border-bottom: 1px solid var(--border);
  background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-left h1 { font-size: 18px; font-weight: 700; }
.topbar-left p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.tab-bar { display: flex; gap: 4px; background: #f0f2f7; padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); }
.tab-btn { padding: 6px 16px; border-radius: 7px; border: none; background: transparent; cursor: pointer; font-size: 13px; font-family: 'Noto Sans SC', sans-serif; color: var(--text-muted); transition: all 0.15s; white-space: nowrap; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: #fff; color: var(--text); border: 1px solid var(--border); font-weight: 500; }

/* CONTENT */
.content { padding: 32px 36px; flex: 1; max-width: 860px; }
.lesson-section { display: none; }
.lesson-section.visible { display: block; }

.section-badge { display: inline-flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--accent); background: var(--accent-bg); border: 1px solid rgba(37,99,235,0.2); padding: 4px 10px; border-radius: 99px; text-transform: uppercase; margin-bottom: 16px; }

/* LESSON BLOCKS */
.lesson-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 26px; margin-bottom: 14px; transition: border-color 0.2s; }
.lesson-block:hover { border-color: var(--border-bright); }
.block-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--accent); margin-bottom: 14px; padding-bottom: 11px; border-bottom: 1px solid var(--border); font-family: 'Space Mono', monospace; letter-spacing: 0.02em; }
.block-body { font-size: 13.5px; line-height: 1.95; color: #3a4158; }
.block-body b { color: var(--text); font-weight: 700; }

.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 5px; font-weight: 500; margin: 0 2px; }
.tag-blue { background: var(--accent-bg); color: var(--accent-dim); }
.tag-green { background: var(--green-bg); color: var(--green); }
.tag-red { background: var(--red-bg); color: var(--red); }
.tag-amber { background: var(--amber-bg); color: var(--amber); }

.code-block { background: #f0f2f7; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin: 10px 0; font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.7; color: #2d3a5e; overflow-x: auto; }

.table-wrap { overflow-x: auto; margin: 12px 0; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: #f0f2f7; padding: 8px 12px; text-align: left; font-weight: 600; color: var(--text); border: 1px solid var(--border); font-size: 12px; }
.data-table td { padding: 8px 12px; border: 1px solid var(--border); color: #3a4158; vertical-align: top; }
.data-table tr:nth-child(even) td { background: #fafbfd; }

.tip-box { background: #fffbeb; border: 1px solid #fde68a; border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 12px 0; font-size: 13px; color: #78350f; line-height: 1.7; }
.info-box { background: #eff6ff; border: 1px solid #bfdbfe; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 12px 0; font-size: 13px; color: #1e40af; line-height: 1.7; }

/* INTERVIEW */
.interview-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
.interview-card:hover { border-color: var(--border-bright); }
.interview-q { padding: 14px 18px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; user-select: none; }
.q-num { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); background: var(--accent-bg); border: 1px solid rgba(37,99,235,0.2); padding: 3px 7px; border-radius: 5px; flex-shrink: 0; margin-top: 1px; }
.q-text { font-size: 13.5px; font-weight: 500; flex: 1; }
.q-arrow { color: var(--text-dim); font-size: 11px; flex-shrink: 0; transition: transform 0.2s; margin-top: 3px; }
.interview-card.open .q-arrow { transform: rotate(90deg); }
.interview-a { padding: 0 18px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.2s; }
.interview-card.open .interview-a { padding: 0 18px 14px; max-height: 600px; }
.answer-box { background: #f5f8ff; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 11px 14px; font-size: 13px; line-height: 1.85; color: #3a4158; }
.answer-box b { color: var(--text); }

/* QUIZ */
.quiz-score-area { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 22px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.score-big { font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 700; color: var(--accent); }
.score-label { font-size: 11px; color: var(--text-muted); }
.score-msg { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.score-sub { font-size: 12px; color: var(--text-muted); }

.quiz-q-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 22px; margin-bottom: 10px; }
.q-label { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 7px; letter-spacing: 0.1em; }
.q-question { font-size: 13.5px; font-weight: 500; margin-bottom: 12px; line-height: 1.6; }
.opts { display: flex; flex-direction: column; gap: 5px; }
.opt-btn { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border-radius: 7px; border: 1px solid var(--border); background: #f9fafb; cursor: pointer; font-size: 13px; font-family: 'Noto Sans SC', sans-serif; color: var(--text); transition: all 0.15s; text-align: left; }
.opt-btn:hover:not(:disabled) { border-color: rgba(37,99,235,0.4); background: var(--accent-bg); }
.opt-letter { width: 21px; height: 21px; border-radius: 50%; background: #e8ecf4; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; flex-shrink: 0; color: var(--text-muted); transition: background 0.15s; }
.opt-btn.selected { border-color: rgba(37,99,235,0.4); background: var(--accent-bg); }
.opt-btn.selected .opt-letter { background: var(--accent-dim); color: #fff; }
.opt-btn.correct { border-color: #15803d; background: var(--green-bg); }
.opt-btn.correct .opt-letter { background: var(--green); color: #fff; }
.opt-btn.wrong { border-color: #b91c1c; background: var(--red-bg); }
.opt-btn.wrong .opt-letter { background: var(--red); color: #fff; }
.opt-btn:disabled { cursor: default; }

.explain-box { display: none; margin-top: 10px; padding: 10px 14px; border-radius: 7px; background: #f0f7ff; border-left: 3px solid var(--accent); font-size: 12.5px; color: #1e40af; line-height: 1.75; }
.explain-box.show { display: block; }
.explain-box.wrong-exp { background: #fff5f5; border-left-color: var(--red); color: #7f1d1d; }

.quiz-actions { display: flex; gap: 8px; margin-top: 18px; }
.btn-check { padding: 10px 26px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 13.5px; font-weight: 700; font-family: 'Noto Sans SC', sans-serif; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.btn-check:hover { opacity: 0.88; }
.btn-check:active { transform: scale(0.97); }
.btn-reset { padding: 10px 18px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; font-family: 'Noto Sans SC', sans-serif; cursor: pointer; transition: all 0.15s; }
.btn-reset:hover { background: var(--card); color: var(--text); border-color: var(--border-bright); }

/* EMPTY */
.empty-main { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 60px 40px; text-align: center; }
.empty-icon { font-size: 54px; margin-bottom: 18px; }
.empty-title { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
.empty-sub { font-size: 13.5px; color: var(--text-muted); max-width: 420px; line-height: 1.75; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 32px; width: 100%; max-width: 460px; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.stat-n { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-l { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

@media (max-width: 768px) {
  .sidebar { width: 100%; position: relative; height: auto; }
  .main { margin-left: 0; }
  .app { flex-direction: column; }
  .content { padding: 18px; }
  .topbar { padding: 14px 18px; flex-direction: column; gap: 10px; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">▣ API Testing Academy</div>
      <div class="sidebar-title">接口测试精通系统<br>Postman & JMeter</div>
      <div class="sidebar-sub">基于6份实战课程笔记整理</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>学习进度</span>
        <span id="progressLabel">0 / 6 完成</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <nav class="nav" id="navList"></nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div id="emptyState" class="empty-main">
      <div class="empty-icon">🚀</div>
      <div class="empty-title">接口测试精通系统</div>
      <div class="empty-sub">系统整合 JMeter + Postman 三天实战训练营全部内容，从基础到持续集成，点击左侧选择章节开始学习。</div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-n">6</div><div class="stat-l">章节</div></div>
        <div class="stat-card"><div class="stat-n">30+</div><div class="stat-l">知识点</div></div>
        <div class="stat-card"><div class="stat-n">36</div><div class="stat-l">题目</div></div>
      </div>
    </div>

    <div id="topbarWrap" style="display:none">
      <div class="topbar">
        <div class="topbar-left">
          <h1 id="topbarTitle"></h1>
          <p id="topbarSub"></p>
        </div>
        <div class="tab-bar">
          <button class="tab-btn active" onclick="switchTab('lesson')">📖 知识讲解</button>
          <button class="tab-btn" onclick="switchTab('interview')">💬 面试问答</button>
          <button class="tab-btn" onclick="switchTab('quiz')">✅ 随堂测验</button>
        </div>
      </div>
    </div>

    <div class="content" id="mainContent" style="display:none">
      <div id="tabLesson" class="lesson-section visible"></div>
      <div id="tabInterview" class="lesson-section"></div>
      <div id="tabQuiz" class="lesson-section"></div>
    </div>
  </main>
</div>

<script>
const topics = [
  // ─── TOPIC 1 ───
  {
    id: 0, icon: "🌐", title: "接口类型与测试流程", zh: "JMeter Day 1 + Postman Day 1",
    lesson: [
      {
        title: "01 — 什么是接口 & 接口分类",
        body: `<b>接口（API）</b>是程序之间约定好的通信方式。<br><br>
<b>按位置分类：</b><br>
• <b>内部接口</b>：系统各子模块之间的接口，或提供给内部系统使用的接口<br>
• <b>外部接口</b>：被测系统调用外部的接口 / 系统对外提供的接口<br><br>
<b>按协议分类（Postman 课程）：</b><br>
• <span class="tag tag-blue">SOAP</span> 基于 XML，地址以 <code>?wsdl</code> 结尾<br>
• <span class="tag tag-green">REST</span> 基于 JSON + HTTP，最主流<br>
• <span class="tag tag-amber">GraphQL</span> 灵活查询语言<br>
• <span class="tag tag-red">WebSocket</span> 全双工，不适合 Postman<br>
• <span class="tag tag-red">RPC</span>（Dubbo/Thrift）全双工，不适合 Postman<br><br>
<div class="info-box">⚡ <b>核心结论：</b>基于 HTTP 的半双工协议（REST、GraphQL、SOAP）适用 Postman；<br>基于 TCP 的全双工（WebSocket、RPC）不适用 Postman。</div>`
      },
      {
        title: "02 — 目前主流接口架构",
        body: `<b>① SOAP 架构</b>：基于 XML 规范，WebService 协议，接口地址以 <code>?wsdl</code> 结尾<br><br>
<b>② RPC 架构</b>：基于 Dubbo 协议、Thrift 协议，SpringCloud 微服务底层<br><br>
<b>③ RESTful 架构</b>（最主流）：基于 JSON + HTTP 协议<br><br>
<b>RESTful 四个核心 HTTP 方法：</b>
<div class="table-wrap"><table class="data-table">
<tr><th>方法</th><th>操作</th><th>示例</th></tr>
<tr><td><span class="tag tag-green">GET</span></td><td>查询</td><td>GET /user → 查询用户列表</td></tr>
<tr><td><span class="tag tag-blue">POST</span></td><td>新增</td><td>POST /user → 新建用户</td></tr>
<tr><td><span class="tag tag-amber">PUT</span></td><td>修改（全量）</td><td>PUT /user/1 → 更新用户信息</td></tr>
<tr><td><span class="tag tag-red">DELETE</span></td><td>删除</td><td>DELETE /user/1 → 删除用户</td></tr>
</table></div>
<b>JSON 数据只有两种结构：</b><br>
• 键值对：<code>{"key": "value"}</code><br>
• 数组：<code>[item1, item2]</code>`
      },
      {
        title: "03 — HTTP 协议详解（请求 & 响应）",
        body: `<b>HTTP 请求 = 请求行 + 请求头 + 请求正文</b><br><br>
<b>请求行：</b><code>POST http://example.com/api HTTP/1.1</code><br><br>
<b>重要请求头字段：</b><br>
• <code>Host</code>：请求主机地址<br>
• <code>Content-Type</code>：内容类型（决定 body 格式）<br>
• <code>Authorization</code>：鉴权信息（Bearer Token）<br>
• <code>Cookie</code>：客户端发给服务器（第1到N次请求都带）<br><br>
<b>常见 HTTP 状态码：</b>
<div class="table-wrap"><table class="data-table">
<tr><th>状态码</th><th>含义</th><th>场景</th></tr>
<tr><td><span class="tag tag-green">200 OK</span></td><td>请求成功</td><td>GET/PUT 成功</td></tr>
<tr><td><span class="tag tag-green">201 Created</span></td><td>资源创建成功</td><td>POST 成功</td></tr>
<tr><td><span class="tag tag-amber">30x</span></td><td>重定向</td><td>页面跳转</td></tr>
<tr><td><span class="tag tag-red">400</span></td><td>请求参数错误</td><td>参数格式不对</td></tr>
<tr><td><span class="tag tag-red">401</span></td><td>未认证</td><td>未登录/Token 过期</td></tr>
<tr><td><span class="tag tag-red">403</span></td><td>无权限</td><td>已登录但没权限</td></tr>
<tr><td><span class="tag tag-red">404</span></td><td>资源不存在</td><td>地址错误</td></tr>
<tr><td><span class="tag tag-red">422</span></td><td>参数验证失败</td><td>格式正确但值非法</td></tr>
<tr><td><span class="tag tag-red">500</span></td><td>服务器内部错误</td><td>后端 Bug</td></tr>
</table></div>
<div class="tip-box">💡 <b>注意：</b>Set-Cookie 只在第一次响应时由服务器发送给客户端；之后每次请求，客户端通过 Cookie 头带回。</div>`
      },
      {
        title: "04 — 接口测试流程（完整6步）",
        body: `<b>标准接口测试流程：</b><br><br>
<b>Step 1 — 准备</b><br>
• 理解需求文档<br>
• 了解接口文档（Swagger / Postman Collections）<br>
• 体验产品 + 抓包分析（Fiddler/Charles）<br><br>
<b>Step 2 — 选择工具</b><br>
• Postman、JMeter、ApiPost、SoapUI<br><br>
<b>Step 3 — 设计测试用例</b><br>
• 正向用例（有效输入，期望成功）<br>
• 有可选参数的扩展正向用例<br>
• 有效反向用例（边界值，期望特定错误码）<br>
• 无效反向用例（非法输入，期望拒绝）<br>
• 破坏性用例（超长参数、SQL注入等）<br><br>
<b>Step 4 — 执行测试</b><br><br>
<b>Step 5 — 持续集成</b>（Postman+Newman+Jenkins）<br><br>
<b>Step 6 — 生成报告</b>

let currentTopic = null;
let currentTab = 'lesson';
let completedTopics = new Set();
let quizAnswers = {};
let quizChecked = false;

function renderNav() {
  const nav = document.getElementById('navList');
  const jmeterTopics = [0,1,4,5];
  const postmanTopics = [0,2,3,5];

  nav.innerHTML = `
    <div class="nav-section">全部章节</div>
    ${topics.map(t => `
      <div class="nav-item ${currentTopic===t.id?'active':''} ${completedTopics.has(t.id)?'done':''}"
           onclick="selectTopic(${t.id})">
        <div class="nav-icon">${t.icon}</div>
        <div class="nav-info">
          <div class="nav-name">${t.title}</div>
          <div class="nav-zh">${t.zh}</div>
        </div>
        <span class="nav-check">✓</span>
      </div>
    `).join('')}
  `;
  const done = completedTopics.size;
  const pct = (done / topics.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = done + ' / ' + topics.length + ' 完成';
}

function selectTopic(id) {
  currentTopic = id;
  quizAnswers = {};
  quizChecked = false;
  const t = topics[id];

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('topbarWrap').style.display = 'block';
  document.getElementById('mainContent').style.display = 'block';

  document.getElementById('topbarTitle').textContent = t.icon + ' ' + t.title;
  document.getElementById('topbarSub').textContent = t.zh + '　·　' + t.lesson.length + ' 知识点 · ' + t.quiz.length + ' 道题';

  renderLesson(t);
  renderInterview(t);
  renderQuiz(t);
  switchTab('lesson');
  renderNav();
}

function renderLesson(t) {
  document.getElementById('tabLesson').innerHTML =
    `<div class="section-badge">📖 知识讲解</div>` +
    t.lesson.map(b => `
      <div class="lesson-block">
        <div class="block-title">${b.title}</div>
        <div class="block-body">${b.body}</div>
      </div>`).join('');
}

function renderInterview(t) {
  document.getElementById('tabInterview').innerHTML =
    `<div class="section-badge">💬 高频面试题 · ${t.interview.length} 题</div>` +
    t.interview.map((item, i) => `
      <div class="interview-card" id="ic${i}">
        <div class="interview-q" onclick="toggleQ(${i})">
          <span class="q-num">Q${String(i+1).padStart(2,'0')}</span>
          <span class="q-text">${item.q}</span>
          <span class="q-arrow">▶</span>
        </div>
        <div class="interview-a">
          <div class="answer-box">${item.a}</div>
        </div>
      </div>`).join('');
}

function toggleQ(i) {
  document.getElementById('ic'+i).classList.toggle('open');
}

function renderQuiz(t) {
  document.getElementById('tabQuiz').innerHTML = `
    <div class="section-badge">✅ 随堂测验 · ${t.quiz.length} 道题</div>
    <div id="quizScoreArea" style="display:none" class="quiz-score-area">
      <div style="text-align:center">
        <div class="score-big" id="scoreBig">0/${t.quiz.length}</div>
        <div class="score-label">得分</div>
      </div>
      <div>
        <div class="score-msg" id="scoreMsg"></div>
        <div class="score-sub" id="scoreSub"></div>
      </div>
    </div>
    ${t.quiz.map((q, i) => `
      <div class="quiz-q-block">
        <div class="q-label">第 ${i+1} 题 / 共 ${t.quiz.length} 题</div>
        <div class="q-question">${q.q}</div>
        <div class="opts">
          ${q.opts.map((o, j) => `
            <button class="opt-btn" id="opt${i}_${j}" onclick="pickAns(${i},${j})">
              <span class="opt-letter">${String.fromCharCode(65+j)}</span>${o}
            </button>`).join('')}
        </div>
        <div class="explain-box" id="exp${i}">${q.exp}</div>
      </div>`).join('')}
    <div class="quiz-actions">
      <button class="btn-check" onclick="checkAnswers()">提交答案</button>
      <button class="btn-reset" onclick="resetQuiz()">↺ 重新作答</button>
    </div>`;
}

function pickAns(qi, oi) {
  if (quizChecked) return;
  const prev = quizAnswers[qi];
  if (prev !== undefined) {
    const prevBtn = document.getElementById('opt'+qi+'_'+prev);
    prevBtn.classList.remove('selected');
    prevBtn.querySelector('.opt-letter').style.background = '';
    prevBtn.querySelector('.opt-letter').style.color = '';
  }
  quizAnswers[qi] = oi;
  document.getElementById('opt'+qi+'_'+oi).classList.add('selected');
}

function checkAnswers() {
  if (quizChecked) return;
  quizChecked = true;
  const t = topics[currentTopic];
  let score = 0;
  t.quiz.forEach((q, i) => {
    t.quiz[i].opts.forEach((_, j) => {
      const btn = document.getElementById('opt'+i+'_'+j);
      btn.disabled = true;
      btn.classList.remove('selected');
    });
    const exp = document.getElementById('exp'+i);
    if (quizAnswers[i] === q.ans) {
      score++;
      document.getElementById('opt'+i+'_'+q.ans).classList.add('correct');
      exp.classList.add('show');
    } else {
      document.getElementById('opt'+i+'_'+q.ans).classList.add('correct');
      if (quizAnswers[i] !== undefined) {
        document.getElementById('opt'+i+'_'+quizAnswers[i]).classList.add('wrong');
      }
      exp.classList.add('show', 'wrong-exp');
    }
  });
  const pct = Math.round(score / t.quiz.length * 100);
  const area = document.getElementById('quizScoreArea');
  area.style.display = 'flex';
  document.getElementById('scoreBig').textContent = score + '/' + t.quiz.length;
  document.getElementById('scoreMsg').textContent = pct >= 75 ? '✅ 优秀！继续保持' : pct >= 50 ? '⚠️ 良好，需要加强' : '❌ 需要重新复习';
  document.getElementById('scoreSub').textContent = '正确率 ' + pct + '%' + (pct >= 75 ? ' — 已标记为完成' : ' — 建议回顾知识点');
  if (pct >= 75) { completedTopics.add(currentTopic); renderNav(); }
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  quizAnswers = {};
  quizChecked = false;
  renderQuiz(topics[currentTopic]);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['lesson','interview','quiz'][i] === tab);
  });
  document.getElementById('tabLesson').classList.toggle('visible', tab === 'lesson');
  document.getElementById('tabInterview').classList.toggle('visible', tab === 'interview');
  document.getElementById('tabQuiz').classList.toggle('visible', tab === 'quiz');
}

renderNav();
</script>
